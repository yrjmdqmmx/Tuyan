name: Configure Scientific V2 Resvg Runtime

on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        required: true
      expected_deployed_sha:
        required: true
      expected_worker_digest:
        required: true
      confirm:
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  configure:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_control_sha }}
      - name: Validate exact request
        env:
          CONTROL_SHA: ${{ inputs.expected_control_sha }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" == "$CONTROL_SHA" ]]
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ && "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ && "$WORKER_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONFIRM" == configure-exact-scientific-v2-resvg-runtime ]]
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Verify immutable Worker WASM and atomically configure its path
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
        run: |
          set -Eeuo pipefail
          printf -v remote_command 'sudo env DEPLOYED_SHA=%q WORKER_DIGEST=%q bash -s' "$DEPLOYED_SHA" "$WORKER_DIGEST"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/paperbanana/repo
          bench_env=/opt/paperbanana/secrets/bench.env
          expected_path=/app/node_modules/@resvg/resvg-wasm/index_bg.wasm
          [[ "$(git -C "$repo" rev-parse --verify HEAD)" == "$DEPLOYED_SHA" ]]
          worker_image="$(awk -F= '$1=="PAPERBANANA_BENCH_WORKER_IMAGE"{print substr($0,index($0,"=")+1)}' "$repo/deploy/hk-single-host/.env")"
          [[ "${worker_image##*@sha256:}" == "$WORKER_DIGEST" ]]
          exec 9>/run/lock/paperbanana-hk-production.lock
          flock -x 9
          docker run --rm --network none --entrypoint node "$worker_image" -e \
            'const fs=require("fs");const p="/app/node_modules/@resvg/resvg-wasm/index_bg.wasm";const s=fs.statSync(p);if(!s.isFile()||s.size<1024)process.exit(1)'
          python3 - "$bench_env" "$expected_path" <<'PY'
          import os, stat, sys, tempfile
          path, expected = sys.argv[1:]
          fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
          try:
              facts = os.fstat(fd)
              if not stat.S_ISREG(facts.st_mode) or facts.st_uid != 0 or facts.st_nlink != 1 or stat.S_IMODE(facts.st_mode) != 0o600:
                  raise RuntimeError()
              raw = os.read(fd, facts.st_size + 1).decode('utf-8', 'strict')
          finally:
              os.close(fd)
          lines = raw.splitlines()
          key = 'RESVG_WASM_PATH'
          matches = [index for index, line in enumerate(lines) if line.split('=', 1)[0] == key]
          if len(matches) > 1:
              raise RuntimeError()
          replacement = f'{key}={expected}'
          if matches: lines[matches[0]] = replacement
          else: lines.append(replacement)
          payload = ('\n'.join(lines) + '\n').encode('utf-8')
          parent = os.path.dirname(path)
          temporary_fd, temporary = tempfile.mkstemp(prefix='.bench-env-resvg-', dir=parent)
          try:
              os.fchmod(temporary_fd, 0o600)
              os.write(temporary_fd, payload)
              os.fsync(temporary_fd)
              os.close(temporary_fd)
              os.chown(temporary, 0, 0)
              os.replace(temporary, path)
              os.chmod(path, 0o600)
          except Exception:
              try: os.close(temporary_fd)
              except OSError: pass
              try: os.unlink(temporary)
              except FileNotFoundError: pass
              raise
          PY
          [[ "$(awk -F= '$1=="RESVG_WASM_PATH"{print $2}' "$bench_env")" == "$expected_path" ]]
          printf '{"resvgWasmPathConfigured":true,"workerDigest":"%s","providerCalls":0}\n' "$WORKER_DIGEST"
          REMOTE
