name: Run Existing Scientific V2 f2f6010

on:
  workflow_dispatch:
    inputs:
      confirm:
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  run:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact request
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$CONFIRM" == run-exact-scientific-v2-bundle-disabled-worker ]]
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Run exact deployed bundle
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
        run: |
          set -Eeuo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/paperbanana/repo && sudo deploy/hk-single-host/scripts/run-scientific-v2-operator.sh --mode run --expected-sha f2f6010a946928966470e31d330635b309cd60bc --expected-core-digest 9ee8abf650d50bb7e707588bf8d2cc9f019af7eafec636fae2bb22a8f4b07c05 --expected-worker-digest c2faf7da36491a1bda56e2fa53b1a2d5032b603059a7eff86aab41378cc1f1e2 --bundle-sha256 894c12e3b314f7a87ac77643af5ceb9323862dbd2e5a1ff853e0a7c767da69f7 --registry-hash f4b55b71eef46cdcbfff01cc73b321a4d03e2aa828f2f93cb004dc1a03887ef1 --suite-hash 127b032a63fc0ffa0a0c540c65064842d5f17cc482ae0de3ef030af2dff3660a --price-hash f1c4bc91161eb272a5fedb46c5cc45b71eb59da9b4cd264d076decb0d61db9a6 --manifest-hash fe109168be8ed0041bbaab5ac02f80aeb3faee803f97a79521b4b181c289e227 --model-count 40 --confirm run-exact-scientific-v2-bundle-disabled-worker --apply'
