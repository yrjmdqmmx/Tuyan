name: Configure Benchmark Credentials Disabled

on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact 40-character commit currently deployed in both Core and Bench.
        required: true
      confirm:
        description: Type configure-benchmark-credentials-disabled to continue.
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-benchmark-credentials-production
  cancel-in-progress: false

jobs:
  configure:
    if: github.event.inputs.confirm == 'configure-benchmark-credentials-disabled'
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          bash -n deploy/hk-single-host/scripts/configure-benchmark-credentials.sh

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Stage and apply disabled credentials
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          PAPERBANANA_BENCH_BAILIAN_API_KEY: ${{ secrets.PAPERBANANA_BENCH_BAILIAN_API_KEY }}
          PAPERBANANA_BENCH_OPENROUTER_API_KEY: ${{ secrets.PAPERBANANA_BENCH_OPENROUTER_API_KEY }}
          PAPERBANANA_BENCH_ARK_API_KEY: ${{ secrets.PAPERBANANA_BENCH_ARK_API_KEY }}
          PAPERBANANA_BENCH_OSS_ACCESS_KEY_ID: ${{ secrets.PAPERBANANA_BENCH_OSS_ACCESS_KEY_ID }}
          PAPERBANANA_BENCH_OSS_ACCESS_KEY_SECRET: ${{ secrets.PAPERBANANA_BENCH_OSS_ACCESS_KEY_SECRET }}
          PAPERBANANA_BENCH_OSS_BUCKET: ${{ secrets.PAPERBANANA_BENCH_OSS_BUCKET }}
          PAPERBANANA_BENCH_OSS_REGION: ${{ secrets.PAPERBANANA_BENCH_OSS_REGION }}
          PAPERBANANA_BENCH_OSS_INTERNAL_ENDPOINT: ${{ secrets.PAPERBANANA_BENCH_OSS_INTERNAL_ENDPOINT }}
          PAPERBANANA_BENCH_OSS_PUBLIC_ENDPOINT: ${{ secrets.PAPERBANANA_BENCH_OSS_PUBLIC_ENDPOINT }}
        run: |
          set -Eeuo pipefail
          umask 077
          local_bundle="$(mktemp)"
          REMOTE_BUNDLE="/tmp/paperbanana-bench-credentials-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 12)"
          cleanup() {
            rm -f -- "$local_bundle"
            ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -f -- '$REMOTE_BUNDLE'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for name in \
            PAPERBANANA_BENCH_BAILIAN_API_KEY \
            PAPERBANANA_BENCH_OPENROUTER_API_KEY \
            PAPERBANANA_BENCH_ARK_API_KEY \
            PAPERBANANA_BENCH_OSS_ACCESS_KEY_ID \
            PAPERBANANA_BENCH_OSS_ACCESS_KEY_SECRET \
            PAPERBANANA_BENCH_OSS_BUCKET \
            PAPERBANANA_BENCH_OSS_REGION \
            PAPERBANANA_BENCH_OSS_INTERNAL_ENDPOINT \
            PAPERBANANA_BENCH_OSS_PUBLIC_ENDPOINT; do
            [[ -n "${!name}" ]]
          done
          {
            printf 'PAPERBANANA_BENCH_BAILIAN_API_KEY=%s\n' "$PAPERBANANA_BENCH_BAILIAN_API_KEY"
            printf 'PAPERBANANA_BENCH_OPENROUTER_API_KEY=%s\n' "$PAPERBANANA_BENCH_OPENROUTER_API_KEY"
            printf 'PAPERBANANA_BENCH_ARK_API_KEY=%s\n' "$PAPERBANANA_BENCH_ARK_API_KEY"
            printf 'PAPERBANANA_BENCH_OSS_ACCESS_KEY_ID=%s\n' "$PAPERBANANA_BENCH_OSS_ACCESS_KEY_ID"
            printf 'PAPERBANANA_BENCH_OSS_ACCESS_KEY_SECRET=%s\n' "$PAPERBANANA_BENCH_OSS_ACCESS_KEY_SECRET"
            printf 'PAPERBANANA_BENCH_OSS_BUCKET=%s\n' "$PAPERBANANA_BENCH_OSS_BUCKET"
            printf 'PAPERBANANA_BENCH_OSS_REGION=%s\n' "$PAPERBANANA_BENCH_OSS_REGION"
            printf 'PAPERBANANA_BENCH_OSS_INTERNAL_ENDPOINT=%s\n' "$PAPERBANANA_BENCH_OSS_INTERNAL_ENDPOINT"
            printf 'PAPERBANANA_BENCH_OSS_PUBLIC_ENDPOINT=%s\n' "$PAPERBANANA_BENCH_OSS_PUBLIC_ENDPOINT"
          } > "$local_bundle"
          chmod 0600 "$local_bundle"
          scp "$local_bundle" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_BUNDLE"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -Eeuo pipefail; chmod 0600 '$REMOTE_BUNDLE'; cd /opt/paperbanana/repo; deploy/hk-single-host/scripts/configure-benchmark-credentials.sh --bundle '$REMOTE_BUNDLE' --expected-sha '$EXPECTED_DEPLOYED_SHA' --apply-disabled"
