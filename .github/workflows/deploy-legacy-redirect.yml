name: Deploy Legacy Domain Redirect

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-legacy-redirect to continue.
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-legacy-redirect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check redirect site
        run: bash deploy/legacy-redirect/check-site.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/legacy-redirect/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
