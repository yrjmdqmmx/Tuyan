name: Deploy Legacy Domain Redirect

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-legacy-redirect to continue.
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-legacy-redirect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check redirect site
        run: |
          set -eu
          d=deploy/legacy-redirect/site
          for f in index.html 404.html about.html privacy-policy.html terms-of-service.html \
                   changelog/index.html leaderboard/index.html leaderboard/methodology/index.html \
                   robots.txt .nojekyll CNAME; do test -f "$d/$f"; done
          grep -qx 'www.paperbanana.asia' "$d/CNAME"
          grep -q 'rel="canonical" href="https://tuyansci.cn/"' "$d/index.html"
          ! grep -qi 'disallow' "$d/robots.txt"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/legacy-redirect/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
