name: Deploy Hong Kong Production

on:
  workflow_dispatch:
    inputs:
      gateway_image:
        description: Auth gateway image including @sha256 digest.
        required: true
      core_image:
        description: Core API image including @sha256 digest.
        required: true
      worker_image:
        description: Plot worker image including @sha256 digest.
        required: true
      mongodb_image:
        description: Mongo image including @sha256 digest.
        required: true
      benchmark_image:
        description: Benchmark worker image including @sha256 digest.
        required: true
      benchmark_secret_mode:
        description: Keep Bench credential handling explicit and fail closed.
        required: true
        type: choice
        default: discovery-only
        options:
          - discovery-only
          - configured-disabled
      confirm:
        description: Type deploy-hk to continue.
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-hk'
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable image references
        env:
          GATEWAY_IMAGE: ${{ inputs.gateway_image }}
          CORE_IMAGE: ${{ inputs.core_image }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
          MONGODB_IMAGE: ${{ inputs.mongodb_image }}
          BENCHMARK_IMAGE: ${{ inputs.benchmark_image }}
          BENCHMARK_SECRET_MODE: ${{ inputs.benchmark_secret_mode }}
        run: |
          set -Eeuo pipefail
          digest='@sha256:[0-9a-f]{64}$'
          [[ "$GATEWAY_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/paperbanana-auth-gateway${digest} ]]
          [[ "$CORE_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/paperbanana-core-api${digest} ]]
          [[ "$WORKER_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/paperbanana-plot-worker${digest} ]]
          [[ "$MONGODB_IMAGE" =~ ^mongo:8\.0\.[0-9]+-noble${digest} ]]
          [[ "$BENCHMARK_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/paperbanana-benchmark-worker${digest} ]]
          [[ "$BENCHMARK_SECRET_MODE" == discovery-only || "$BENCHMARK_SECRET_MODE" == configured-disabled ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Install image lock and deploy
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          GATEWAY_IMAGE: ${{ inputs.gateway_image }}
          CORE_IMAGE: ${{ inputs.core_image }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
          MONGODB_IMAGE: ${{ inputs.mongodb_image }}
          BENCHMARK_IMAGE: ${{ inputs.benchmark_image }}
          BENCHMARK_SECRET_MODE: ${{ inputs.benchmark_secret_mode }}
        run: |
          set -Eeuo pipefail
          image_lock="$(mktemp)"
          trap 'rm -f "$image_lock"' EXIT
          {
            printf 'PAPERBANANA_GATEWAY_IMAGE=%s\n' "$GATEWAY_IMAGE"
            printf 'PAPERBANANA_CORE_IMAGE=%s\n' "$CORE_IMAGE"
            printf 'PAPERBANANA_PLOT_WORKER_IMAGE=%s\n' "$WORKER_IMAGE"
            printf 'PAPERBANANA_MONGODB_IMAGE=%s\n' "$MONGODB_IMAGE"
            printf 'PAPERBANANA_BENCH_WORKER_IMAGE=%s\n' "$BENCHMARK_IMAGE"
            printf 'PAPERBANANA_BENCH_SECRET_MODE=%s\n' "$BENCHMARK_SECRET_MODE"
            printf 'COMPOSE_PROFILES=benchmark\n'
          } > "$image_lock"
          REMOTE_LOCK="/tmp/paperbanana-image-lock-${GITHUB_RUN_ID}"
          scp "$image_lock" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_LOCK"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -Eeuo pipefail; cd /opt/paperbanana/repo && git fetch --quiet origin '${GITHUB_SHA}' && git checkout --detach '${GITHUB_SHA}' && install -m 0600 '$REMOTE_LOCK' deploy/hk-single-host/.env && rm -f '$REMOTE_LOCK' && PAPERBANANA_CODE_SHA='${GITHUB_SHA}' deploy/hk-single-host/scripts/bootstrap-benchmark.sh '--$BENCHMARK_SECRET_MODE' && deploy/hk-single-host/scripts/deploy.sh --apply"
