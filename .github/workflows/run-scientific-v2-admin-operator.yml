name: Run Scientific Benchmark V2 Admin Operator

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [freeze, remediate-freeze, attest, diagnose, import-worker, import-codex, export-review, import-review, import-arbitration, publish]
      expected_control_sha:
        description: Exact GitHub workflow checkout SHA; may differ from the frozen deployed data-plane SHA.
        required: true
      expected_deployed_sha:
        required: true
      expected_core_digest:
        required: true
      expected_worker_digest:
        required: true
      input_sha256:
        description: SHA-256 of the pre-staged root 0600 private input.
        required: true
      confirm:
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  admin:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate immutable request
        env:
          OPERATION: ${{ inputs.operation }}
          CONTROL_SHA: ${{ inputs.expected_control_sha }}
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          CORE_DIGEST: ${{ inputs.expected_core_digest }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          INPUT_HASH: ${{ inputs.input_sha256 }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$CONTROL_SHA" ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          for hash in "$CORE_DIGEST" "$WORKER_DIGEST" "$INPUT_HASH"; do [[ "$hash" =~ ^[a-f0-9]{64}$ ]]; done
          [[ "$CONFIRM" == "$OPERATION-scientific-v2-admin-disabled-worker" ]]
          bash -n deploy/hk-single-host/scripts/run-scientific-v2-admin-operator.sh
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Execute localhost admin transport
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          CORE_DIGEST: ${{ inputs.expected_core_digest }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          INPUT_HASH: ${{ inputs.input_sha256 }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          printf -v command 'cd %q && sudo %q --operation %q --expected-sha %q --expected-core-digest %q --expected-worker-digest %q --input-sha256 %q --confirm %q' \
            /opt/paperbanana/repo deploy/hk-single-host/scripts/run-scientific-v2-admin-operator.sh \
            "$OPERATION" "$EXPECTED_SHA" "$CORE_DIGEST" "$WORKER_DIGEST" "$INPUT_HASH" "$CONFIRM"
          if [[ "$OPERATION" == export-review ]]; then
            review_output="$RUNNER_TEMP/scientific-v2-review-export.json"
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "$command" >"$review_output"
            chmod 0600 "$review_output"
            jq -e '
              .schemaVersion == 1 and .operation == "export-review" and
              (.data.role == "A" or .data.role == "B") and
              (.data.packages | type) == "array" and (.data.packages | length) > 0 and
              ([.data.packages[].items[]] | length) > 0 and
              ([.data.packages[].items[]] | all(
                (.imageUrl | type) == "string" and (.imageUrl | startswith("https://")) and
                (.imageHash | type) == "string" and (.imageHash | test("^[a-f0-9]{64}$"))
              )) and
              ([.. | objects | keys[]] | index("privateMappings") == null) and
              ([.. | objects | keys[]] | index("privateEnvelope") == null) and
              ([.. | objects | keys[]] | index("reviewerIdentity") == null) and
              ([.. | objects | keys[]] | index("objectKey") == null)
            ' "$review_output" >/dev/null
            jq -c '{operation,role:.data.role,packetCount:(.data.packages|length),itemCount:([.data.packages[].items[]]|length)}' "$review_output"
          else
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "$command"
          fi

      - name: Upload short-lived signed blind review package
        if: ${{ inputs.operation == 'export-review' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scientific-v2-review-export-${{ inputs.input_sha256 }}
          path: ${{ runner.temp }}/scientific-v2-review-export.json
          if-no-files-found: error
          retention-days: 1
