name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy.
        required: true
        default: main
      confirm:
        description: Type deploy-pages to continue.
        required: true
      bench_enabled:
        description: Enable the public /bench route only after an immutable release exists.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.inputs.confirm == 'deploy-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --filter @paperbanana/web... --frozen-lockfile

      - name: Test web
        run: pnpm --filter @paperbanana/web test

      - name: Build web
        run: pnpm --filter @paperbanana/web build
        env:
          VITE_BACKEND_MODE: gateway
          VITE_API_BASE: https://api.paperbanana.asia
          VITE_AUTH_ENABLED: true
          VITE_AUTH_BASE: https://api.paperbanana.asia
          VITE_BASE_PATH: /
          VITE_BENCH_ENABLED: ${{ inputs.bench_enabled }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
