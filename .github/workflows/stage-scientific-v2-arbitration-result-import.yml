name: Stage Scientific V2 Arbitration Result Import

on:
  workflow_dispatch:
    inputs:
      batch_id: { required: true }
      expected_control_sha: { required: true }
      expected_deployed_sha: { required: true }
      expected_worker_digest: { required: true }
      arbitration_bundle_sha256: { required: true }
      manifest_hash: { required: true }
      worker_arbitration_hash: { required: true }
      worker_attestation_hash: { required: true }
      confirm: { required: true }

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  stage:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate exact Worker arbitration envelope
        env:
          CONTROL_SHA: ${{ inputs.expected_control_sha }}
          BATCH_ID: ${{ inputs.batch_id }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          ARBITRATION_BUNDLE_SHA: ${{ inputs.arbitration_bundle_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          WORKER_ARBITRATION_HASH: ${{ inputs.worker_arbitration_hash }}
          WORKER_ATTESTATION_HASH: ${{ inputs.worker_attestation_hash }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" == "$CONTROL_SHA" && "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ && "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BATCH_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,199}$ ]]
          for hash in "$WORKER_DIGEST" "$ARBITRATION_BUNDLE_SHA" "$MANIFEST_HASH" "$WORKER_ARBITRATION_HASH" "$WORKER_ATTESTATION_HASH"; do
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          done
          [[ "$CONFIRM" == stage-exact-scientific-v2-arbitration-result-import ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Stage root-only API arbitration import
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          BATCH_ID: ${{ inputs.batch_id }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          ARBITRATION_BUNDLE_SHA: ${{ inputs.arbitration_bundle_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          WORKER_ARBITRATION_HASH: ${{ inputs.worker_arbitration_hash }}
          WORKER_ATTESTATION_HASH: ${{ inputs.worker_attestation_hash }}
        run: |
          set -Eeuo pipefail
          printf -v remote_command 'sudo env BATCH_ID=%q DEPLOYED_SHA=%q WORKER_DIGEST=%q ARBITRATION_BUNDLE_SHA=%q MANIFEST_HASH=%q WORKER_ARBITRATION_HASH=%q WORKER_ATTESTATION_HASH=%q bash -s' \
            "$BATCH_ID" "$DEPLOYED_SHA" "$WORKER_DIGEST" "$ARBITRATION_BUNDLE_SHA" "$MANIFEST_HASH" "$WORKER_ARBITRATION_HASH" "$WORKER_ATTESTATION_HASH"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/paperbanana-hk-production.lock
          flock -x 9
          repo=/opt/paperbanana/repo
          bundle_root=/opt/paperbanana/operator-bundles/scientific-v2
          review_private_root=/opt/paperbanana/operator-private/scientific-v2
          admin_input_root=/opt/paperbanana/operator-private/scientific-v2/admin-inputs
          bundle="$bundle_root/$ARBITRATION_BUNDLE_SHA.json"
          arbitrated="$review_private_root/$ARBITRATION_BUNDLE_SHA.review-arbitrated.json"
          [[ "$(git -C "$repo" rev-parse --verify HEAD)" == "$DEPLOYED_SHA" ]]
          worker_id="$(docker ps --filter label=com.docker.compose.project=paperbanana-hk --filter label=com.docker.compose.service=benchmark-worker --format '{{.ID}}')"
          [[ "$worker_id" =~ ^[a-f0-9]+$ ]]
          image_id="$(docker inspect --format '{{.Image}}' "$worker_id")"
          docker image inspect --format '{{json .RepoDigests}}' "$image_id" | jq -e --arg digest "sha256:$WORKER_DIGEST" 'any(.[]; endswith("@" + $digest))' >/dev/null
          docker exec "$worker_id" node -e 'if(process.env.PAPERBANANA_BENCH_ENABLED!=="false"||process.env.PAPERBANANA_BENCH_CONCURRENCY!=="1")process.exit(1)'
          for path in "$bundle" "$arbitrated"; do
            [[ -f "$path" && ! -L "$path" && "$(stat -c '%u:%g:%a' "$path")" =~ ^0:0:0?600$ ]]
          done
          [[ -d "$admin_input_root" && ! -L "$admin_input_root" && "$(stat -c '%u:%g:%a' "$admin_input_root")" =~ ^0:0:0?700$ ]]
          output="$(mktemp /tmp/paperbanana-scientific-v2-arbitration-import.XXXXXXXXXXXX.json)"
          cleanup() { rm -f -- "$output"; }
          trap cleanup EXIT
          python3 - "$bundle" "$arbitrated" "$BATCH_ID" "$MANIFEST_HASH" "$WORKER_ARBITRATION_HASH" "$WORKER_ATTESTATION_HASH" "$output" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import stat
          import sys

          bundle_path, arbitrated_path, batch_id, manifest_hash, worker_arbitration_hash, worker_attestation_hash, output_path = sys.argv[1:]

          def protected(path, limit=64 * 1024 * 1024):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_nlink != 1 or stat.S_IMODE(before.st_mode) != 0o600 or before.st_size < 2 or before.st_size > limit:
                      raise RuntimeError('protected')
                  data = b''
                  while len(data) <= limit:
                      chunk = os.read(fd, min(1024 * 1024, limit + 1 - len(data)))
                      if not chunk:
                          break
                      data += chunk
                  after = os.fstat(fd)
                  path_stat = os.stat(path, follow_symlinks=False)
                  if len(data) != before.st_size or (before.st_dev, before.st_ino, before.st_mtime_ns, before.st_ctime_ns) != (after.st_dev, after.st_ino, after.st_mtime_ns, after.st_ctime_ns) or (before.st_dev, before.st_ino) != (path_stat.st_dev, path_stat.st_ino):
                      raise RuntimeError('drift')
                  return data
              finally:
                  os.close(fd)

          def canonical(value):
              if isinstance(value, list):
                  return '[' + ','.join(canonical(item) for item in value) + ']'
              if isinstance(value, dict):
                  return '{' + ','.join(json.dumps(key, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(value[key]) for key in sorted(value, key=str.casefold)) + '}'
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False)

          def digest(value):
              return hashlib.sha256(canonical(value).encode('utf-8')).hexdigest()

          bundle = json.loads(protected(bundle_path))
          arbitrated = json.loads(protected(arbitrated_path))
          if bundle.get('operation') != 'review_arbitrate' or bundle.get('input', {}).get('reviewerA', {}).get('batchManifestHash') != manifest_hash or bundle.get('input', {}).get('reviewerB', {}).get('batchManifestHash') != manifest_hash:
              raise RuntimeError('bundle')
          secret = bundle['input'].get('attestationSecret')
          inner = bundle['input'].get('arbitration')
          source_set_hash = bundle['input']['reviewerA'].get('sourceSetHash')
          if not isinstance(secret, str) or len(secret.encode('utf-8')) < 32 or len(secret.encode('utf-8')) > 4096 or not isinstance(inner, dict) or set(inner) != {'reasoningEffort', 'results'} or inner.get('reasoningEffort') != 'xhigh' or source_set_hash != bundle['input']['reviewerB'].get('sourceSetHash'):
              raise RuntimeError('input')
          expected_top = {'operation', 'providerCalls', 'canFinalize', 'disputes', 'results', 'attestation'}
          if not isinstance(arbitrated, dict) or set(arbitrated) != expected_top or arbitrated.get('operation') != 'review_arbitrate' or arbitrated.get('providerCalls') != 0 or arbitrated.get('canFinalize') is not True:
              raise RuntimeError('result')
          attestation = arbitrated['attestation']
          expected_attestation_keys = {'schemaVersion', 'reviewProtocol', 'canFinalize', 'automaticJudgeCalls', 'reviewerAHash', 'reviewerBHash', 'resultsHash', 'disputeCount', 'arbitrationHash', 'attestationHash'}
          if not isinstance(attestation, dict) or set(attestation) != expected_attestation_keys or attestation.get('automaticJudgeCalls') != 0 or attestation.get('disputeCount', 0) < 1 or attestation.get('arbitrationHash') != worker_arbitration_hash or attestation.get('attestationHash') != worker_attestation_hash or digest(inner) != worker_arbitration_hash:
              raise RuntimeError('worker-attestation')
          attestation_base = {key: value for key, value in attestation.items() if key != 'attestationHash'}
          expected_worker_attestation = hmac.new(secret.encode('utf-8'), digest(attestation_base).encode('ascii'), hashlib.sha256).hexdigest()
          if not hmac.compare_digest(worker_attestation_hash, expected_worker_attestation):
              raise RuntimeError('worker-hmac')
          api_arbitration = {'batchManifestHash': manifest_hash, 'sourceSetHash': source_set_hash, 'reasoningEffort': 'xhigh', 'results': inner['results']}
          api_arbitration_hash = digest(api_arbitration)
          api_attestation_hash = hmac.new(secret.encode('utf-8'), api_arbitration_hash.encode('ascii'), hashlib.sha256).hexdigest()
          payload = {
              'batchId': batch_id,
              'arbitration': api_arbitration,
              'arbitrationHash': api_arbitration_hash,
              'attestationHash': api_attestation_hash,
          }
          encoded = (json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n').encode('utf-8')
          fd = os.open(output_path, os.O_WRONLY | os.O_TRUNC | os.O_NOFOLLOW)
          try:
              os.fchmod(fd, 0o600)
              view = memoryview(encoded)
              while view:
                  written = os.write(fd, view)
                  if written < 1:
                      raise RuntimeError('write')
                  view = view[written:]
              os.fsync(fd)
          finally:
              os.close(fd)
          PY
          chmod 0600 "$output"
          input_sha="$(sha256sum "$output" | awk '{print $1}')"
          destination="$admin_input_root/$input_sha.json"
          if [[ -e "$destination" ]]; then
            [[ -f "$destination" && ! -L "$destination" && "$(stat -c '%u:%g:%a' "$destination")" =~ ^0:0:0?600$ ]]
            cmp -s "$output" "$destination"
          else
            install -o 0 -g 0 -m 0600 "$output" "$destination"
          fi
          api_arbitration_hash="$(jq -r .arbitrationHash "$destination")"
          printf '{"operation":"stage-scientific-v2-arbitration-result-import","providerCalls":0,"manifestHash":"%s","workerArbitrationHash":"%s","apiArbitrationHash":"%s","adminInputSha256":"%s"}\n' \
            "$MANIFEST_HASH" "$WORKER_ARBITRATION_HASH" "$api_arbitration_hash" "$input_sha"
          REMOTE
