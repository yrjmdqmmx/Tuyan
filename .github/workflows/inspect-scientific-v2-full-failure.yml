name: Inspect Scientific V2 Full Failure

on:
  workflow_dispatch:
    inputs:
      manifest_hash:
        description: Exact Scientific V2 manifest hash to inspect.
        required: true
      confirm:
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  inspect:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - name: Validate request
        env:
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$MANIFEST_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONFIRM" == inspect-exact-scientific-v2-full-failure ]]
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Read bounded dispatch state
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
        run: |
          set -Eeuo pipefail
          printf -v remote_command 'sudo env SCIENTIFIC_V2_MANIFEST_HASH=%q bash -s' "$MANIFEST_HASH"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/run/lock/paperbanana-hk-production.lock
          flock -x 9
          docker exec -e SCIENTIFIC_V2_MANIFEST_HASH="$SCIENTIFIC_V2_MANIFEST_HASH" -i paperbanana-hk-mongodb-1 bash -lc 'exec mongosh --quiet --host 127.0.0.1 --username "$MONGO_INITDB_ROOT_USERNAME" --password "$(cat /run/secrets/mongo_root_password)" --authenticationDatabase admin paperbanana_benchmark --file /dev/stdin' <<'JS'
          const manifestHash = process.env.SCIENTIFIC_V2_MANIFEST_HASH;
          const batch = db.getCollection("paperbanana_benchmark_scientific_v2_batches").findOne({manifestHash});
          if (!batch) throw new Error("SCIENTIFIC_V2_BATCH_NOT_FOUND");
          const started = db.getCollection("paperbanana_benchmark_scientific_v2_dispatches")
            .find({manifestHash, status: "started"}, {_id: 0, slotId: 1, attemptIndex: 1, startedAt: 1})
            .sort({startedAt: 1}).toArray();
          const slots = new Map(batch.state.slots.map(slot => [slot.slotId, slot]));
          const unresolved = started.map(marker => {
            const slot = slots.get(marker.slotId);
            return {
              slotId: marker.slotId,
              attemptIndex: marker.attemptIndex,
              provider: slot?.provider ?? null,
              canonicalModelId: slot?.canonicalModelId ?? null,
              modelId: slot?.modelId ?? null,
              caseId: slot?.caseId ?? null,
              slotStatus: slot?.status ?? null,
              persistedAttemptCount: slot?.attempts?.length ?? null,
            };
          });
          const firstOpen = batch.state.slots.find(slot => !["succeeded","unsupported","failed"].includes(slot.status));
          const statusCounts = batch.state.slots.reduce((counts, slot) => {
            counts[slot.status] = (counts[slot.status] || 0) + 1;
            return counts;
          }, {});
          const nonTerminal = batch.state.slots
            .filter(slot => !["succeeded","unsupported","failed"].includes(slot.status))
            .map(slot => ({sequence: slot.sequence, slotId: slot.slotId, provider: slot.provider, status: slot.status, attemptCount: slot.attempts.length}));
          const successfulArtifacts = batch.state.slots
            .filter(slot => slot.status === "succeeded" && slot.attempts.length > 0)
            .map(slot => {
              const attempt = slot.attempts.at(-1);
              return {
                sequence: slot.sequence,
                slotId: slot.slotId,
                provider: slot.provider,
                canonicalModelId: slot.canonicalModelId,
                caseId: slot.caseId,
                rawImageHash: attempt.rawImageHash,
                byteSize: attempt.byteSize,
                width: attempt.width,
                height: attempt.height,
                format: attempt.format,
              };
            });
          print(JSON.stringify({
            manifestHash,
            stateHash: batch.stateHash,
            batchStatus: batch.status,
            stateStatus: batch.state.status,
            pauseReason: batch.state.pauseReason,
            blockReason: batch.state.blockReason,
            claimPresent: Object.hasOwn(batch, "claimToken"),
            claimLeaseExpired: batch.claimLeaseExpiresAt instanceof Date ? batch.claimLeaseExpiresAt <= new Date() : null,
            providerSpentCny: batch.state.providerSpentCny,
            statusCounts,
            successfulArtifacts,
            nonTerminal,
            unresolved,
            firstOpen: firstOpen ? {
              slotId: firstOpen.slotId,
              provider: firstOpen.provider,
              canonicalModelId: firstOpen.canonicalModelId,
              modelId: firstOpen.modelId,
              caseId: firstOpen.caseId,
              status: firstOpen.status,
              attemptCount: firstOpen.attempts.length,
            } : null,
          }));
          JS
          worker_id="$(docker ps --filter label=com.docker.compose.project=paperbanana-hk --filter label=com.docker.compose.service=benchmark-worker --format '{{.ID}}')"
          [[ "$worker_id" =~ ^[a-f0-9]+$ ]]
          docker exec -e SCIENTIFIC_V2_MANIFEST_HASH="$SCIENTIFIC_V2_MANIFEST_HASH" "$worker_id" node --input-type=module -e '
          import OSS from "ali-oss";
          import { MongoClient } from "mongodb";
          const manifestHash=process.env.SCIENTIFIC_V2_MANIFEST_HASH;
          const mongo=new MongoClient(process.env.PAPERBANANA_BENCH_MONGODB_URI);
          await mongo.connect();
          try {
            const db=mongo.db(process.env.PAPERBANANA_BENCH_MONGO_DB||"paperbanana_benchmark");
            const batch=await db.collection("paperbanana_benchmark_scientific_v2_batches").findOne({manifestHash});
            const marker=await db.collection("paperbanana_benchmark_scientific_v2_dispatches").findOne({manifestHash,status:"started"});
            if(!batch||!marker)throw new Error("SCIENTIFIC_V2_UNRESOLVED_MARKER_NOT_FOUND");
            const known=new Set(batch.state.slots.flatMap(slot=>slot.attempts.map(attempt=>attempt.rawImageHash).filter(Boolean)));
            for(const scientificCase of batch.manifest.cases)if(scientificCase.sourceHash)known.add(scientificCase.sourceHash);
            const oss=new OSS({region:process.env.PAPERBANANA_BENCH_OSS_REGION,accessKeyId:process.env.PAPERBANANA_BENCH_OSS_ACCESS_KEY_ID,accessKeySecret:process.env.PAPERBANANA_BENCH_OSS_ACCESS_KEY_SECRET,bucket:process.env.PAPERBANANA_BENCH_OSS_BUCKET,endpoint:process.env.PAPERBANANA_BENCH_OSS_INTERNAL_ENDPOINT,secure:true,authorizationV4:true});
            const objects=[];let nextMarker;
            do{const page=await oss.list({prefix:"bench/scientific-v2/private/objects/","max-keys":1000,...(nextMarker?{marker:nextMarker}:{})},{});objects.push(...(page.objects||[]));nextMarker=page.isTruncated?page.nextMarker:undefined;}while(nextMarker);
            const startedAt=new Date(marker.startedAt).getTime();
            const candidates=objects.flatMap(object=>{
              const match=/\/([a-f0-9]{64})\.(png|jpeg|webp)$/.exec(object.name||"");
              const modifiedAt=new Date(object.lastModified).getTime();
              return match&&!known.has(match[1])&&modifiedAt>=startedAt-5000&&modifiedAt<=startedAt+600000?[{imageHash:match[1],format:match[2],byteSize:Number(object.size),lastModified:new Date(modifiedAt).toISOString()}]:[];
            });
            process.stdout.write(JSON.stringify({slotId:marker.slotId,attemptIndex:marker.attemptIndex,candidateCount:candidates.length,candidates})+"\n");
          }finally{await mongo.close();}
          '
          docker exec "$worker_id" node --input-type=module -e '
          const checks = [
            ["bailian", "PAPERBANANA_BENCH_BAILIAN_API_KEY", "https://dashscope.aliyuncs.com/api/v1/models/permissions?authorization_scope=AUTHORIZED&action=INFERENCE&model=qwen-image-2.0&page_no=1&page_size=1"],
            ["ark", "PAPERBANANA_BENCH_ARK_API_KEY", "https://ark.cn-beijing.volces.com/ping"],
            ["openrouter", "PAPERBANANA_BENCH_OPENROUTER_API_KEY", "https://openrouter.ai/api/v1/key"],
          ];
          const result = {};
          for (const [provider, keyName, url] of checks) {
            try {
              const response = await fetch(url, {headers: {Authorization: `Bearer ${process.env[keyName]}`}, signal: AbortSignal.timeout(15000)});
              result[provider] = {status: response.status, ok: response.ok};
              await response.body?.cancel();
            } catch (error) {
              result[provider] = {status: null, ok: false, errorClass: String(error?.name || "Error")};
            }
          }
          process.stdout.write(JSON.stringify({credentialEgressChecks: result}) + "\n");
          '
          marker_started_at="$(docker exec -e SCIENTIFIC_V2_MANIFEST_HASH="$SCIENTIFIC_V2_MANIFEST_HASH" -i paperbanana-hk-mongodb-1 bash -lc 'exec mongosh --quiet --host 127.0.0.1 --username "$MONGO_INITDB_ROOT_USERNAME" --password "$(cat /run/secrets/mongo_root_password)" --authenticationDatabase admin paperbanana_benchmark --eval '\''const row=db.getCollection("paperbanana_benchmark_scientific_v2_dispatches").findOne({manifestHash:process.env.SCIENTIFIC_V2_MANIFEST_HASH,status:"started"});print(row.startedAt.toISOString())'\''' | tail -1)"
          marker_epoch="$(date -d "$marker_started_at" +%s)"
          spool_count=0
          spool_bytes=0
          while IFS= read -r -d '' file; do
            modified="$(stat -c %Y "$file")"
            if (( modified >= marker_epoch - 5 && modified <= marker_epoch + 600 )); then
              spool_count=$((spool_count + 1))
              spool_bytes=$((spool_bytes + $(stat -c %s "$file")))
            fi
          done < <(find /opt/paperbanana/data/scientific-v2-artifact-spool -maxdepth 1 -type f -print0)
          printf '{"spoolCandidateCount":%d,"spoolCandidateBytes":%d}\n' "$spool_count" "$spool_bytes"
          REMOTE
