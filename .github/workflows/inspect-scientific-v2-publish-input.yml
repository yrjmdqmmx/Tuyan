name: Inspect Scientific V2 Publish Input

on:
  workflow_dispatch:
    inputs:
      expected_control_sha: { required: true }
      expected_deployed_sha: { required: true }
      expected_core_digest: { required: true }
      expected_worker_digest: { required: true }
      render_bundle_sha256: { required: true }
      manifest_hash: { required: true }
      confirm: { required: true }

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  inspect:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate exact zero-provider inspection envelope
        env:
          CONTROL_SHA: ${{ inputs.expected_control_sha }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          CORE_DIGEST: ${{ inputs.expected_core_digest }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          RENDER_BUNDLE_SHA: ${{ inputs.render_bundle_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" == "$CONTROL_SHA" && "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ && "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          for hash in "$CORE_DIGEST" "$WORKER_DIGEST" "$RENDER_BUNDLE_SHA" "$MANIFEST_HASH"; do
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          done
          [[ "$CONFIRM" == inspect-exact-scientific-v2-publish-input ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect protected publish-input facts
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          CORE_DIGEST: ${{ inputs.expected_core_digest }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          RENDER_BUNDLE_SHA: ${{ inputs.render_bundle_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
        run: |
          set -Eeuo pipefail
          diagnostic="deploy/hk-single-host/scripts/diagnose-scientific-v2-publish-input.cjs"
          diagnostic_sha="$(sha256sum "$diagnostic" | awk '{print $1}')"
          remote_diagnostic="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; mktemp /tmp/paperbanana-scientific-v2-publish-diagnostic.XXXXXXXXXXXX.cjs')"
          [[ "$remote_diagnostic" =~ ^/tmp/paperbanana-scientific-v2-publish-diagnostic[.][A-Za-z0-9]{8,}[.]cjs$ ]]
          cleanup() { ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -f -- '$remote_diagnostic'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          scp "$diagnostic" "$DEPLOY_USER@$DEPLOY_HOST:$remote_diagnostic"
          printf -v remote_command 'sudo env DEPLOYED_SHA=%q CORE_DIGEST=%q WORKER_DIGEST=%q RENDER_BUNDLE_SHA=%q MANIFEST_HASH=%q DIAGNOSTIC_PATH=%q DIAGNOSTIC_SHA=%q bash -s' \
            "$DEPLOYED_SHA" "$CORE_DIGEST" "$WORKER_DIGEST" "$RENDER_BUNDLE_SHA" "$MANIFEST_HASH" "$remote_diagnostic" "$diagnostic_sha"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          trap 'status=$?; line=$LINENO; trap - ERR; printf "{\"operation\":\"inspect-scientific-v2-publish-input-failure\",\"providerCalls\":0,\"line\":%s,\"exitCode\":%s}\\n" "$line" "$status" >&2; exit "$status"' ERR
          umask 077
          exec 9>/run/lock/paperbanana-hk-production.lock
          flock -x 9
          repo=/opt/paperbanana/repo
          deploy_dir="$repo/deploy/hk-single-host"
          deploy_env="$deploy_dir/.env"
          private_root=/opt/paperbanana/operator-private/scientific-v2
          rendered="$private_root/$RENDER_BUNDLE_SHA.publish-input.json"
          [[ "$(git -C "$repo" rev-parse --verify HEAD)" == "$DEPLOYED_SHA" ]]
          [[ -f "$DIAGNOSTIC_PATH" && ! -L "$DIAGNOSTIC_PATH" && "$(sha256sum "$DIAGNOSTIC_PATH" | awk '{print $1}')" == "$DIAGNOSTIC_SHA" ]]
          diagnostic_target="$private_root/$DIAGNOSTIC_SHA.publish-diagnostic.cjs"
          if [[ -e "$diagnostic_target" ]]; then
            [[ -f "$diagnostic_target" && ! -L "$diagnostic_target" && "$(stat -c '%u:%g:%a:%h' "$diagnostic_target")" =~ ^0:0:0?600:1$ ]]
            cmp -s "$DIAGNOSTIC_PATH" "$diagnostic_target"
          else
            install -o 0 -g 0 -m 0600 "$DIAGNOSTIC_PATH" "$diagnostic_target"
          fi
          [[ "$(sha256sum "$diagnostic_target" | awk '{print $1}')" == "$DIAGNOSTIC_SHA" ]]
          core_id="$(docker ps --filter label=com.docker.compose.project=paperbanana-hk --filter label=com.docker.compose.service=paperbanana-api --format '{{.ID}}')"
          [[ "$core_id" =~ ^[a-f0-9]+$ ]]
          core_image_id="$(docker inspect --format '{{.Image}}' "$core_id")"
          docker image inspect --format '{{json .RepoDigests}}' "$core_image_id" | jq -e --arg digest "sha256:$CORE_DIGEST" 'any(.[]; endswith("@" + $digest))' >/dev/null
          worker_id="$(docker ps --filter label=com.docker.compose.project=paperbanana-hk --filter label=com.docker.compose.service=benchmark-worker --format '{{.ID}}')"
          [[ "$worker_id" =~ ^[a-f0-9]+$ ]]
          image_id="$(docker inspect --format '{{.Image}}' "$worker_id")"
          docker image inspect --format '{{json .RepoDigests}}' "$image_id" | jq -e --arg digest "sha256:$WORKER_DIGEST" 'any(.[]; endswith("@" + $digest))' >/dev/null
          docker exec "$worker_id" node -e 'if(process.env.PAPERBANANA_BENCH_ENABLED!=="false"||process.env.PAPERBANANA_BENCH_CONCURRENCY!=="1")process.exit(1)'
          [[ -d "$private_root" && ! -L "$private_root" && "$(stat -c '%u:%g:%a' "$private_root")" =~ ^0:0:0?700$ ]]
          python3 - "$rendered" "$private_root" "$RENDER_BUNDLE_SHA" "$MANIFEST_HASH" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys

          path, private_root, render_bundle_sha, manifest_hash = sys.argv[1:]
          limit = 64 * 1024 * 1024
          try:
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
          except OSError:
              candidates = sorted(
                  match.group(1)
                  for name in os.listdir(private_root)
                  if (match := re.fullmatch(r'([a-f0-9]{64})[.]publish-input[.]json', name))
              )
              print(json.dumps({
                  'operation': 'inspect-scientific-v2-publish-input-path-facts',
                  'providerCalls': 0,
                  'expectedBundleHash': render_bundle_sha,
                  'expectedExists': False,
                  'candidateBundleHashes': candidates[:64],
                  'candidateCount': len(candidates),
              }, separators=(',', ':')), file=sys.stderr)
              raise
          try:
              before = os.fstat(fd)
              if (not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_nlink != 1
                      or stat.S_IMODE(before.st_mode) != 0o600 or before.st_size < 2 or before.st_size > limit):
                  raise RuntimeError('protected')
              data = b''
              while len(data) <= limit:
                  chunk = os.read(fd, min(1024 * 1024, limit + 1 - len(data)))
                  if not chunk:
                      break
                  data += chunk
              after = os.fstat(fd)
              path_stat = os.stat(path, follow_symlinks=False)
              if (len(data) != before.st_size
                      or (before.st_dev, before.st_ino, before.st_mtime_ns, before.st_ctime_ns)
                      != (after.st_dev, after.st_ino, after.st_mtime_ns, after.st_ctime_ns)
                      or (before.st_dev, before.st_ino) != (path_stat.st_dev, path_stat.st_ino)):
                  raise RuntimeError('drift')
          finally:
              os.close(fd)

          def canonical(value):
              if isinstance(value, list):
                  return '[' + ','.join(canonical(item) for item in value) + ']'
              if isinstance(value, dict):
                  return '{' + ','.join(json.dumps(key, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(value[key]) for key in sorted(value, key=str.casefold)) + '}'
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False)

          rendered = json.loads(data)
          if (not isinstance(rendered, dict) or set(rendered) != {'operation', 'providerCalls', 'publishInput', 'publishInputHash'}
                  or rendered.get('operation') != 'render_public_evidence' or rendered.get('providerCalls') != 0
                  or not re.fullmatch(r'[a-f0-9]{64}', str(rendered.get('publishInputHash', '')))):
              raise RuntimeError('envelope')
          publish_input = rendered['publishInput']
          if (not isinstance(publish_input, dict) or set(publish_input) != {'batchId', 'objectBindings', 'evidence'}
                  or publish_input.get('batchId') != 'scientific-v2-' + manifest_hash[:20]
                  or not isinstance(publish_input.get('objectBindings'), list) or not publish_input['objectBindings']
                  or not isinstance(publish_input.get('evidence'), list) or not publish_input['evidence']
                  or hashlib.sha256(canonical(publish_input).encode('utf-8')).hexdigest() != rendered['publishInputHash']):
              raise RuntimeError('binding')
          print(json.dumps({
              'operation': 'inspect-scientific-v2-publish-input',
              'providerCalls': 0,
              'manifestHash': manifest_hash,
              'publishInputHash': rendered['publishInputHash'],
              'evidenceCount': len(publish_input['evidence']),
              'objectBindingCount': len(publish_input['objectBindings']),
          }, separators=(',', ':')))
          PY
          compose=(docker compose --project-name paperbanana-hk --project-directory "$deploy_dir" --env-file "$deploy_env" -f "$deploy_dir/compose.yaml")
          "${compose[@]}" run --rm --no-deps -T --user 0:0 \
            -v "$rendered:/input.json:ro" -v "$diagnostic_target:/diagnostic.cjs:ro" \
            paperbanana-api node /diagnostic.cjs /input.json </dev/null
          REMOTE
