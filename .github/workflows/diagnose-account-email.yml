name: Diagnose Production Account Email

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type diagnose-account-email to continue.
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-production-account-email-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.inputs.confirm == 'diagnose-account-email'
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect safe account email state and filtered result logs
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
        run: |
          set -Eeuo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          gateway_env=/opt/paperbanana/secrets/gateway.env
          test -f "$gateway_env"
          grep -qx 'AUTH_EMAIL_DELIVERY_ENABLED=true' "$gateway_env"
          grep -qx 'AUTH_REQUIRE_EMAIL_VERIFICATION=false' "$gateway_env"
          grep -qx 'ALIBABA_DIRECTMAIL_REGION_ID=cn-hangzhou' "$gateway_env"
          grep -qx 'ALIBABA_DIRECTMAIL_ENDPOINT=dm.aliyuncs.com' "$gateway_env"
          grep -Eq '^ALIBABA_DIRECTMAIL_ACCESS_KEY_ID=.+$' "$gateway_env"
          grep -Eq '^ALIBABA_DIRECTMAIL_ACCESS_KEY_SECRET=.+$' "$gateway_env"

          compose=(docker compose --project-name paperbanana-hk --project-directory /opt/paperbanana/repo/deploy/hk-single-host --env-file /opt/paperbanana/repo/deploy/hk-single-host/.env -f /opt/paperbanana/repo/deploy/hk-single-host/compose.yaml)
          "${compose[@]}" ps --status running auth-gateway | grep -q auth-gateway
          "${compose[@]}" exec -T auth-gateway node -e '
            const state = {
              deliveryEnabled: process.env.AUTH_EMAIL_DELIVERY_ENABLED === "true",
              verificationRequired: process.env.AUTH_REQUIRE_EMAIL_VERIFICATION === "true",
              regionIsHangzhou: process.env.ALIBABA_DIRECTMAIL_REGION_ID === "cn-hangzhou",
              endpointIsDirectMail: process.env.ALIBABA_DIRECTMAIL_ENDPOINT === "dm.aliyuncs.com",
              accountNamePresent: Boolean(process.env.ALIBABA_DIRECTMAIL_ACCOUNT_NAME),
              accessKeyIdPresent: Boolean(process.env.ALIBABA_DIRECTMAIL_ACCESS_KEY_ID),
              accessKeySecretPresent: Boolean(process.env.ALIBABA_DIRECTMAIL_ACCESS_KEY_SECRET),
            };
            console.log(JSON.stringify(state));
            if (!state.deliveryEnabled || state.verificationRequired || !state.regionIsHangzhou || !state.endpointIsDirectMail || !state.accountNamePresent || !state.accessKeyIdPresent || !state.accessKeySecretPresent) process.exit(1);
          ' </dev/null

          "${compose[@]}" exec -T auth-gateway node --input-type=module -e '
            import { MongoClient } from "mongodb";
            const windowSeconds = Number(process.env.AUTH_EMAIL_WINDOW_SECONDS || 900);
            const windowMax = Number(process.env.AUTH_EMAIL_WINDOW_MAX || 3);
            const currentBucket = Math.floor(Date.now() / 1000 / windowSeconds);
            const client = new MongoClient(process.env.MONGODB_URI);
            await client.connect();
            try {
              const collection = client.db(process.env.MONGODB_DB || "paperbanana_auth").collection("authMailRateLimit");
              const active = await collection.find({
                _id: { $regex: ":window:" },
                expiresAt: { $gt: new Date() },
              }).project({ _id: 1, count: 1 }).toArray();
              const current = active.filter((item) => String(item._id).endsWith(`:window:${currentBucket}`));
              const counts = active.map((item) => Number(item.count || 0));
              const currentCounts = current.map((item) => Number(item.count || 0));
              const summary = {
                activeWindowBuckets: active.length,
                currentWindowBuckets: current.length,
                windowBucketsAtOrOverLimit: counts.filter((count) => count >= windowMax).length,
                windowBucketsOverLimit: counts.filter((count) => count > windowMax).length,
                currentWindowBucketsOverLimit: currentCounts.filter((count) => count > windowMax).length,
                maxObservedWindowCount: counts.length ? Math.max(...counts) : 0,
                currentMaxObservedWindowCount: currentCounts.length ? Math.max(...currentCounts) : 0,
                configuredWindowMax: windowMax,
              };
              console.log(JSON.stringify({ accountEmailRateLimit: summary }));
            } finally {
              await client.close();
            }
          ' </dev/null

          filtered_logs=$("${compose[@]}" logs --since 2h --no-color auth-gateway 2>&1 | awk '
            /account email (sent|failed)/ { in_account_email=1; print; next }
            in_account_email && /(template|requestId|result|providerCode):/ { print; next }
            in_account_email && /[|][[:space:]]*}/ { in_account_email=0 }
          ' || true)
          if [[ -z "$filtered_logs" ]]; then
            echo 'No account email result logs found in the last two hours.'
          else
            printf '%s\n' "$filtered_logs" \
              | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/[EMAIL_REDACTED]/g' \
              | tail -n 50
          fi
          REMOTE
