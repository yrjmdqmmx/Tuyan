name: Stage Scientific Benchmark V2 Run Bundle

on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        required: true
      manifest_sha256:
        required: true
      state_sha256:
        required: true
      attestation_result_sha256:
        required: true
      manifest_hash:
        required: true
      registry_hash:
        required: true
      suite_hash:
        required: true
      price_hash:
        required: true
      execution_phase:
        required: true
        type: choice
        options: [canary-only, full]
      confirm:
        description: Type stage-scientific-v2-run-bundle to continue.
        required: true

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  stage:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate immutable staging request
        env:
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          MANIFEST_FILE_HASH: ${{ inputs.manifest_sha256 }}
          STATE_FILE_HASH: ${{ inputs.state_sha256 }}
          ATTESTATION_FILE_HASH: ${{ inputs.attestation_result_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          REGISTRY_HASH: ${{ inputs.registry_hash }}
          SUITE_HASH: ${{ inputs.suite_hash }}
          PRICE_HASH: ${{ inputs.price_hash }}
          EXECUTION_PHASE: ${{ inputs.execution_phase }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" && "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          for hash in "$MANIFEST_FILE_HASH" "$STATE_FILE_HASH" "$ATTESTATION_FILE_HASH" "$MANIFEST_HASH" "$REGISTRY_HASH" "$SUITE_HASH" "$PRICE_HASH"; do
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          done
          [[ "$EXECUTION_PHASE" == canary-only || "$EXECUTION_PHASE" == full ]]
          [[ "$CONFIRM" == stage-scientific-v2-run-bundle ]]
          bash -n deploy/hk-single-host/scripts/stage-scientific-v2-run-bundle.sh
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Stage exact protected run bundle
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          EXPECTED_SHA: ${{ inputs.expected_deployed_sha }}
          MANIFEST_FILE_HASH: ${{ inputs.manifest_sha256 }}
          STATE_FILE_HASH: ${{ inputs.state_sha256 }}
          ATTESTATION_FILE_HASH: ${{ inputs.attestation_result_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          REGISTRY_HASH: ${{ inputs.registry_hash }}
          SUITE_HASH: ${{ inputs.suite_hash }}
          PRICE_HASH: ${{ inputs.price_hash }}
          EXECUTION_PHASE: ${{ inputs.execution_phase }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          printf -v command 'cd %q && sudo %q --expected-sha %q --manifest-sha256 %q --state-sha256 %q --attestation-result-sha256 %q --manifest-hash %q --registry-hash %q --suite-hash %q --price-hash %q --execution-phase %q --confirm %q' \
            /opt/paperbanana/repo deploy/hk-single-host/scripts/stage-scientific-v2-run-bundle.sh \
            "$EXPECTED_SHA" "$MANIFEST_FILE_HASH" "$STATE_FILE_HASH" "$ATTESTATION_FILE_HASH" \
            "$MANIFEST_HASH" "$REGISTRY_HASH" "$SUITE_HASH" "$PRICE_HASH" "$EXECUTION_PHASE" "$CONFIRM"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "$command"
