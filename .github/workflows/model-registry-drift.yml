name: Model registry drift report

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  report-tokendance-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test drift severity and failure handling
        run: node --test tests/tokendance-drift.test.mjs
      - name: Report discovery changes and fail on new execution regressions
        shell: bash
        run: node scripts/check-tokendance-catalog.mjs | tee "$RUNNER_TEMP/tokendance-drift.json"
      - name: Preserve TokenDance drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokendance-drift-report
          path: ${{ runner.temp }}/tokendance-drift.json
          if-no-files-found: warn
          retention-days: 30
  report-openrouter-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report catalog drift without changing recommendations
        run: pnpm --dir apps/paperbanana-api check:model-drift
