name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mongo-index-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test MongoDB 8 benchmark index migration
        run: deploy/hk-single-host/tests/run-mongo-index-migration-integration.sh

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paperbanana/auth-gateway test
      - run: pnpm --filter @paperbanana/paperbanana-api test
      - run: pnpm --filter @paperbanana/paperbanana-api check
      - run: pnpm --filter @paperbanana/paperbanana-api build
      - run: pnpm --filter @paperbanana/benchmark-core test
      - run: pnpm --filter @paperbanana/benchmark-core check
      - run: pnpm --filter @paperbanana/benchmark-worker test
      - run: pnpm --filter @paperbanana/benchmark-worker check
      - run: pnpm --filter @paperbanana/benchmark-worker build
      - run: node --test packages/api/src/*.test.js
      - run: pnpm --filter @paperbanana/web test
      - run: pnpm --filter @paperbanana/web build
      - run: pnpm --filter @paperbanana/miniprogram check
      - run: node --test apps/miniprogram/tests/*.test.cjs
      - name: Run retained client-platform contracts
        run: node --test tests/client-platform/*.test.mjs
      - run: node --test tests/*.test.mjs
      - run: node --test apps/laf-functions/tests/*.test.cjs
      - run: node --test deploy/hk-single-host/tests/*.test.mjs
      - run: node --test deploy/sg-egress/tests/*.test.mjs

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/auth-gateway/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/paperbanana-api/Dockerfile
          push: false
          build-args: |
            PAPERBANANA_CODE_SHA=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/benchmark-worker/Dockerfile
          push: false
          build-args: |
            PAPERBANANA_CODE_SHA=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/plot-worker
          file: apps/plot-worker/Dockerfile
          push: false
      - run: python3 -m unittest discover -s apps/plot-worker/tests -p 'test_*.py'
