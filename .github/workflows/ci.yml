name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paperbanana/auth-gateway test
      - run: pnpm --filter @paperbanana/paperbanana-api test
      - run: pnpm --filter @paperbanana/paperbanana-api check
      - run: pnpm --filter @paperbanana/paperbanana-api build
      - run: node --test packages/api/src/*.test.js
      - run: pnpm --filter @paperbanana/web test
      - run: pnpm --filter @paperbanana/web build
      - run: pnpm --filter @paperbanana/miniprogram check
      - run: node --test apps/miniprogram/tests/*.test.cjs
      - run: pnpm --filter @paperbanana/android typecheck
      - run: node --test apps/android/tests/*.test.mjs
      - run: node --test tests/*.test.mjs
      - run: node --test apps/laf-functions/tests/*.test.cjs
      - run: node --test deploy/hk-single-host/tests/*.test.mjs
      - run: node --test deploy/sg-egress/tests/*.test.mjs

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/auth-gateway/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/paperbanana-api/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: apps/plot-worker
          file: apps/plot-worker/Dockerfile
          push: false
      - run: python3 -m unittest discover -s apps/plot-worker/tests -p 'test_*.py'

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/macos
      - name: Select newest Xcode 26
        shell: bash
        run: |
          xcode_path="$(
            python3 - <<'PY'
          from glob import glob
          from pathlib import Path

          def version(path: str) -> tuple[int, ...]:
              name = Path(path).stem.removeprefix("Xcode_")
              return tuple(int(part) for part in name.split(".") if part.isdigit())

          candidates = glob("/Applications/Xcode_26*.app")
          if candidates:
              print(max(candidates, key=version))
          PY
          )"
          test -x "${xcode_path}/Contents/Developer/usr/bin/xcodebuild"
          echo "DEVELOPER_DIR=${xcode_path}/Contents/Developer" >> "$GITHUB_ENV"
      - name: Test iOS shared job contracts
        shell: bash
        run: |
          xcodebuild test \
            -project apps/ios/paperbanana.xcodeproj \
            -scheme PaperBanana \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -only-testing:PaperBananaTests/JobDecodingTests \
            -only-testing:PaperBananaTests/PayloadEncodingTests \
            -only-testing:PaperBananaTests/ProviderCatalogTests \
            -only-testing:PaperBananaTests/APIClientTests \
            CODE_SIGNING_ALLOWED=NO

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build apps/windows/PaperBanana.Windows.csproj -c Release -p:Platform=x64
