name: Stage Scientific V2 Review Result Import

on:
  workflow_dispatch:
    inputs:
      role:
        required: true
        type: choice
        options: [A, B]
      batch_id: { required: true }
      expected_control_sha: { required: true }
      expected_deployed_sha: { required: true }
      expected_worker_digest: { required: true }
      validation_bundle_sha256: { required: true }
      manifest_hash: { required: true }
      result_hash: { required: true }
      result_attestation_hash: { required: true }
      confirm: { required: true }

permissions:
  contents: read

concurrency:
  group: paperbanana-hk-production
  cancel-in-progress: false

jobs:
  stage:
    environment: paperbanana-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate exact signed result envelope
        env:
          ROLE: ${{ inputs.role }}
          BATCH_ID: ${{ inputs.batch_id }}
          CONTROL_SHA: ${{ inputs.expected_control_sha }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          VALIDATION_BUNDLE_SHA: ${{ inputs.validation_bundle_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          RESULT_HASH: ${{ inputs.result_hash }}
          RESULT_ATTESTATION_HASH: ${{ inputs.result_attestation_hash }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$ROLE" == A || "$ROLE" == B ]]
          [[ "$BATCH_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,199}$ ]]
          [[ "$GITHUB_SHA" == "$CONTROL_SHA" && "$CONTROL_SHA" =~ ^[a-f0-9]{40}$ && "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          for hash in "$WORKER_DIGEST" "$VALIDATION_BUNDLE_SHA" "$MANIFEST_HASH" "$RESULT_HASH" "$RESULT_ATTESTATION_HASH"; do
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          done
          [[ "$CONFIRM" == stage-exact-scientific-v2-review-result-import ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_HK_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Stage root-only admin review import
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HK_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_HK_USER }}
          ROLE: ${{ inputs.role }}
          BATCH_ID: ${{ inputs.batch_id }}
          DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          WORKER_DIGEST: ${{ inputs.expected_worker_digest }}
          VALIDATION_BUNDLE_SHA: ${{ inputs.validation_bundle_sha256 }}
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          RESULT_HASH: ${{ inputs.result_hash }}
          RESULT_ATTESTATION_HASH: ${{ inputs.result_attestation_hash }}
        run: |
          set -Eeuo pipefail
          printf -v remote_command 'sudo env ROLE=%q BATCH_ID=%q DEPLOYED_SHA=%q WORKER_DIGEST=%q VALIDATION_BUNDLE_SHA=%q MANIFEST_HASH=%q RESULT_HASH=%q RESULT_ATTESTATION_HASH=%q bash -s' \
            "$ROLE" "$BATCH_ID" "$DEPLOYED_SHA" "$WORKER_DIGEST" "$VALIDATION_BUNDLE_SHA" "$MANIFEST_HASH" "$RESULT_HASH" "$RESULT_ATTESTATION_HASH"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          exec 9>/run/lock/paperbanana-hk-production.lock
          flock -x 9
          repo=/opt/paperbanana/repo
          review_private_root=/opt/paperbanana/operator-private/scientific-v2
          admin_input_root=/opt/paperbanana/operator-private/scientific-v2/admin-inputs
          core_env=/opt/paperbanana/secrets/core.env
          validated="$review_private_root/$VALIDATION_BUNDLE_SHA.review-validated.json"
          [[ "$(git -C "$repo" rev-parse --verify HEAD)" == "$DEPLOYED_SHA" ]]
          worker_id="$(docker ps --filter label=com.docker.compose.project=paperbanana-hk --filter label=com.docker.compose.service=benchmark-worker --format '{{.ID}}')"
          [[ "$worker_id" =~ ^[a-f0-9]+$ ]]
          image_id="$(docker inspect --format '{{.Image}}' "$worker_id")"
          docker image inspect --format '{{json .RepoDigests}}' "$image_id" | jq -e --arg digest "sha256:$WORKER_DIGEST" 'any(.[]; endswith("@" + $digest))' >/dev/null
          docker exec "$worker_id" node -e 'if(process.env.PAPERBANANA_BENCH_ENABLED!=="false"||process.env.PAPERBANANA_BENCH_CONCURRENCY!=="1")process.exit(1)'
          for path in "$validated" "$core_env"; do
            [[ -f "$path" && ! -L "$path" && "$(stat -c '%u:%g:%a' "$path")" =~ ^0:0:0?600$ ]]
          done
          [[ -d "$admin_input_root" && ! -L "$admin_input_root" && "$(stat -c '%u:%g:%a' "$admin_input_root")" =~ ^0:0:0?700$ ]]
          output="$(mktemp /tmp/paperbanana-scientific-v2-review-result-import.XXXXXXXXXXXX.json)"
          cleanup() { rm -f -- "$output"; }
          trap cleanup EXIT
          python3 - "$validated" "$core_env" "$ROLE" "$BATCH_ID" "$MANIFEST_HASH" "$RESULT_HASH" "$RESULT_ATTESTATION_HASH" "$output" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import stat
          import sys

          validated_path, core_env_path, role, batch_id, manifest_hash, result_hash, result_attestation_hash, output_path = sys.argv[1:]

          def protected(path, limit=64 * 1024 * 1024):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_nlink != 1 or stat.S_IMODE(before.st_mode) != 0o600 or before.st_size < 2 or before.st_size > limit:
                      raise RuntimeError('protected')
                  data = b''
                  while len(data) <= limit:
                      chunk = os.read(fd, min(1024 * 1024, limit + 1 - len(data)))
                      if not chunk:
                          break
                      data += chunk
                  after = os.fstat(fd)
                  path_stat = os.stat(path, follow_symlinks=False)
                  if len(data) != before.st_size or (before.st_dev, before.st_ino, before.st_mtime_ns, before.st_ctime_ns) != (after.st_dev, after.st_ino, after.st_mtime_ns, after.st_ctime_ns) or (before.st_dev, before.st_ino) != (path_stat.st_dev, path_stat.st_ino):
                      raise RuntimeError('drift')
                  return data
              finally:
                  os.close(fd)

          def canonical(value):
              if isinstance(value, list):
                  return '[' + ','.join(canonical(item) for item in value) + ']'
              if isinstance(value, dict):
                  return '{' + ','.join(json.dumps(key, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(value[key]) for key in sorted(value, key=str.casefold)) + '}'
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False)

          def digest(value):
              return hashlib.sha256(canonical(value).encode('utf-8')).hexdigest()

          validated = json.loads(protected(validated_path))
          if not isinstance(validated, dict) or set(validated) != {'operation', 'providerCalls', 'result'} or validated['operation'] != 'review_validate' or validated['providerCalls'] != 0:
              raise RuntimeError('schema')
          result = validated['result']
          expected_keys = {'role', 'batchManifestHash', 'sourceSetHash', 'assignmentAttestationHash', 'assignmentSet', 'mappingHash', 'items', 'resultHash', 'resultAttestationHash'}
          if not isinstance(result, dict) or set(result) != expected_keys or result.get('role') != role or result.get('batchManifestHash') != manifest_hash or result.get('resultHash') != result_hash or result.get('resultAttestationHash') != result_attestation_hash:
              raise RuntimeError('binding')
          base = {key: value for key, value in result.items() if key not in {'resultHash', 'resultAttestationHash'}}
          if digest(base) != result_hash:
              raise RuntimeError('result-hash')
          env_text = protected(core_env_path, 1024 * 1024).decode('utf-8')
          secrets = [line.split('=', 1)[1] for line in env_text.splitlines() if line.startswith('PAPERBANANA_BENCH_REVIEW_SIGNING_SECRET=')]
          if len(secrets) != 1 or len(secrets[0].encode('utf-8')) < 32 or len(secrets[0].encode('utf-8')) > 4096:
              raise RuntimeError('secret')
          expected_attestation = hmac.new(secrets[0].encode('utf-8'), digest({**base, 'resultHash': result_hash}).encode('ascii'), hashlib.sha256).hexdigest()
          if not hmac.compare_digest(result_attestation_hash, expected_attestation):
              raise RuntimeError('attestation')
          payload = {'batchId': batch_id, 'result': result}
          encoded = (json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n').encode('utf-8')
          fd = os.open(output_path, os.O_WRONLY | os.O_TRUNC | os.O_NOFOLLOW)
          try:
              os.fchmod(fd, 0o600)
              view = memoryview(encoded)
              while view:
                  written = os.write(fd, view)
                  if written < 1:
                      raise RuntimeError('write')
                  view = view[written:]
              os.fsync(fd)
          finally:
              os.close(fd)
          PY
          chmod 0600 "$output"
          input_sha="$(sha256sum "$output" | awk '{print $1}')"
          destination="$admin_input_root/$input_sha.json"
          if [[ -e "$destination" ]]; then
            [[ -f "$destination" && ! -L "$destination" && "$(stat -c '%u:%g:%a' "$destination")" =~ ^0:0:0?600$ ]]
            cmp -s "$output" "$destination"
          else
            install -o 0 -g 0 -m 0600 "$output" "$destination"
          fi
          printf '{"operation":"stage-scientific-v2-review-result-import","providerCalls":0,"role":"%s","manifestHash":"%s","resultHash":"%s","adminInputSha256":"%s"}\n' \
            "$ROLE" "$MANIFEST_HASH" "$RESULT_HASH" "$input_sha"
          REMOTE
