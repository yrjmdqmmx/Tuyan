name: Verify Laf Rollback Prerequisites

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type verify-legacy-laf-rollback to inspect the repository prerequisites.
        required: true

permissions:
  contents: read

concurrency:
  group: laf-functions
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.inputs.confirm == 'verify-legacy-laf-rollback'
    environment: legacy-sealos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository rollback prerequisites
        run: |
          set -euo pipefail

          test -f apps/laf-functions/paperbanana-api.ts
          test -f apps/paperbanana-api/package.json
          grep -Fq "from 'jpeg-js/lib/decoder'" apps/laf-functions/paperbanana-api.ts
          node -e 'const pkg=require("./apps/paperbanana-api/package.json"); if (pkg.dependencies?.["jpeg-js"] !== "0.4.4") process.exit(1)'

      - name: Record manual-console guidance
        run: |
          {
            echo "## Laf rollback verification-only check"
            echo "This workflow does not publish source or authenticate to Laf."
            echo "Any approved rollback must be completed manually in the Laf console."
            echo "Before pasting or publishing the reviewed source, inspect the paused Laf application's custom dependency metadata and verify exactly jpeg-js@0.4.4."
            echo "Until that console metadata has an authenticated machine-readable check, automated Laf publishing remains disabled."
          } >> "$GITHUB_STEP_SUMMARY"
