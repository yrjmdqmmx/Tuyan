name: Deploy Laf Functions

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-legacy-laf to continue.
        required: true
      function_name:
        description: Laf function name to deploy.
        required: true
        default: paperbanana-api
      source_file:
        description: Source file path in this repository.
        required: true
        default: apps/laf-functions/paperbanana-api.ts
      laf_jpeg_js_dependency_version:
        description: Confirm the Laf custom dependency is already configured as jpeg-js@0.4.4 by entering 0.4.4.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: laf-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-legacy-laf'
    environment: legacy-sealos
    runs-on: ubuntu-latest
    env:
      LAF_APPID: ${{ secrets.LAF_APPID }}
      LAF_PAT: ${{ secrets.LAF_PAT }}
      LAF_SERVER: ${{ secrets.LAF_SERVER }}
      FUNCTION_NAME: ${{ inputs.function_name || 'paperbanana-api' }}
      SOURCE_FILE: ${{ inputs.source_file || 'apps/laf-functions/paperbanana-api.ts' }}
      LAF_JPEG_JS_DEPENDENCY_VERSION: ${{ inputs.laf_jpeg_js_dependency_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets and source file
        run: |
          test -n "$LAF_APPID" || (echo "Missing GitHub secret: LAF_APPID" && exit 1)
          test -n "$LAF_PAT" || (echo "Missing GitHub secret: LAF_PAT" && exit 1)
          test -f "$SOURCE_FILE" || (echo "Missing source file: $SOURCE_FILE" && exit 1)
          test "$LAF_JPEG_JS_DEPENDENCY_VERSION" = "0.4.4" || (echo "Refusing Laf source push: first configure custom dependency jpeg-js@0.4.4, then confirm version input 0.4.4" && exit 1)

      - name: Install Laf CLI
        run: npm install -g laf-cli@1.0.0-patch.0

      - name: Deploy function
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          cp "$SOURCE_FILE" "$workdir/source.ts"
          cd "$workdir"

          laf_server="${LAF_SERVER:-https://api.laf.run}"
          laf user add ci -r "$laf_server"
          laf user switch ci
          laf login "$LAF_PAT"

          laf app init "$LAF_APPID"

          mkdir -p functions
          cp "$workdir/source.ts" "functions/${FUNCTION_NAME}.ts"
          cat > "functions/${FUNCTION_NAME}.yaml" <<YAML
          name: ${FUNCTION_NAME}
          desc: PaperBanana API
          methods:
            - GET
            - POST
          tags: []
          YAML

          laf func push "$FUNCTION_NAME"
