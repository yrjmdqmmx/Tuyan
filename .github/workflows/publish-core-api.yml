name: Publish Core API Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish.
        required: true
        default: main
      confirm:
        description: Type publish-hk to continue.
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: paperbanana-core-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/paperbanana-core-api

jobs:
  build:
    if: github.event.inputs.confirm == 'publish-hk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: source
        name: Resolve checked-out source SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=sha-${{ steps.source.outputs.sha }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/paperbanana-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PAPERBANANA_CODE_SHA=${{ steps.source.outputs.sha }}
      - name: Record immutable image
        run: echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
