# Private origin for the Hangzhou entry; the upstream TLS identity remains api.paperbanana.asia.
server {
    listen 443 ssl;
    server_name tuyansci.cn;
    ssl_certificate /etc/letsencrypt/live/api.paperbanana.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.paperbanana.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 116.62.146.226;
    deny all;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:13006;
        proxy_set_header Host tuyansci.cn;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
