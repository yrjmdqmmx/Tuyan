server {
    listen 80;
    listen [::]:80;
    server_name tuyansci.cn www.tuyansci.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://tuyansci.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tuyansci.cn;
    ssl_certificate /etc/letsencrypt/live/tuyansci.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuyansci.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://tuyansci.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuyansci.cn;
    ssl_certificate /etc/letsencrypt/live/tuyansci.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuyansci.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/tuyan-entry/current;
    index index.html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /api/ {
        proxy_pass https://47.243.4.247;
        proxy_ssl_server_name on;
        proxy_ssl_name api.paperbanana.asia;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host tuyansci.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location = /paperbanana-api {
        proxy_pass https://47.243.4.247;
        proxy_ssl_server_name on;
        proxy_ssl_name api.paperbanana.asia;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host tuyansci.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass https://47.243.4.247;
        proxy_ssl_server_name on;
        proxy_ssl_name api.paperbanana.asia;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host tuyansci.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location = /ready {
        proxy_pass https://47.243.4.247;
        proxy_ssl_server_name on;
        proxy_ssl_name api.paperbanana.asia;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host tuyansci.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /fonts/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /account/ { try_files $uri =404; add_header Cache-Control "no-store"; add_header Referrer-Policy "no-referrer" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
