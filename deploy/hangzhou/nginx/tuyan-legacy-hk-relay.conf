# Legacy API access through the existing HK edge. TLS verifies tuyansci.cn.
server {
    listen 443 ssl;
    server_name api.paperbanana.asia;
    ssl_certificate /etc/letsencrypt/live/tuyansci.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuyansci.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 47.243.4.247;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 1100k;
    # Workspace metadata and base64 results have their own authenticated gateway limits.
    # Bounded 2 MiB avatar encoded as JSON; authentication remains in Gateway.
    location = /api/account/profile/avatar {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:13005;
        proxy_http_version 1.1;
        proxy_set_header Host api.paperbanana.asia;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }

    location = /api/workspace {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:13005;
        proxy_http_version 1.1;
        proxy_set_header Host api.paperbanana.asia;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }

    location = /api/workspace/results {
        client_max_body_size 15m;
        proxy_pass http://127.0.0.1:13005;
        proxy_http_version 1.1;
        proxy_set_header Host api.paperbanana.asia;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:13005;
        proxy_http_version 1.1;
        proxy_set_header Host api.paperbanana.asia;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }
}
