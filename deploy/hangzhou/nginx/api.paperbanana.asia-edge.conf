server {
    listen 80;
    listen [::]:80;
    server_name api.paperbanana.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.paperbanana.asia;

    ssl_certificate /etc/letsencrypt/live/api.paperbanana.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.paperbanana.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:paperbanana_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /var/log/nginx/paperbanana-api.access.log;
    error_log /var/log/nginx/paperbanana-api.error.log warn;

    # Keep the edge slightly above the application contract so the gateway,
    # not Nginx's HTML error page, returns the stable JSON 413 envelope.
    client_max_body_size 1100k;

    # Workspace metadata and base64 results have their own authenticated gateway limits.
    # Bounded 2 MiB avatar encoded as JSON; authentication remains in Gateway.
    location = /api/account/profile/avatar {
        client_max_body_size 3m;
        proxy_pass https://116.62.146.226;
        proxy_ssl_server_name on;
        proxy_ssl_name tuyansci.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }

    location = /api/workspace {
        client_max_body_size 3m;
        proxy_pass https://116.62.146.226;
        proxy_ssl_server_name on;
        proxy_ssl_name tuyansci.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }

    location = /api/workspace/results {
        client_max_body_size 15m;
        proxy_pass https://116.62.146.226;
        proxy_ssl_server_name on;
        proxy_ssl_name tuyansci.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass https://116.62.146.226;
        proxy_ssl_server_name on;
        proxy_ssl_name tuyansci.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }
}
