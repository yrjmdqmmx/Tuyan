<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>页面未找到 · PaperBanana</title>
    <script>
      if (/(?:^|\/)(?:leaderboard|bench)(?:\/|$)/.test(location.pathname)) {
        document.documentElement.classList.add('leaderboard-fallback-route')
        document.title = '正在打开排行榜 · PaperBanana'
      }
    </script>
    <style>
      body{margin:0;background:#f5f1e8;color:#191b1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      main{min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px}
      h1{margin:0 0 8px;font-size:30px}p{margin:0 0 20px;color:#6b716f}a{color:#2f5668;font-weight:700}
      [data-leaderboard-loading]{display:none}
      .leaderboard-fallback-route [data-generic-not-found]{display:none}
      .leaderboard-fallback-route [data-leaderboard-loading]{display:grid}
    </style>
  </head>
  <body>
    <main data-generic-not-found>
      <h1>页面未找到</h1>
      <p>这个地址不存在，或者页面已经移动。</p>
      <a href="/" data-app-home>返回 PaperBanana 工作台</a>
    </main>
    <main data-leaderboard-loading aria-live="polite">
      <h1>正在打开排行榜</h1>
      <p>正在恢复模型或题目详情，请稍候。</p>
    </main>
    <script type="module" src="/src/leaderboardFallback.js"></script>
  </body>
</html>
