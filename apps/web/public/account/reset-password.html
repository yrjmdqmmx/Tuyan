<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置图研密码</title><link rel="stylesheet" href="./account.css"></head><body><main class="card"><div class="brand"><img src="/logo.svg" alt="图研"><span>图研 Tuyan</span></div><section id="form-state"><h1>重置密码</h1><p>请输入 8–128 位新密码。完成后，所有旧会话都会被撤销。</p><form id="reset-form"><label for="password">新密码</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><label for="confirmation">再次输入</label><input id="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><div id="message" class="status hidden" role="status"></div><div class="actions"><button type="submit">确认重置</button></div></form></section><section id="invalid-state" class="hidden"><h1>链接已失效</h1><p>重置链接缺失、过期或已经使用，请返回图研重新申请。</p><div class="actions"><a href="/">返回图研</a></div></section><section id="success-state" class="hidden"><h1>密码重置成功</h1><p>旧会话已撤销。现在可以使用新密码登录。</p><div class="actions"><a href="/">返回图研登录</a></div></section></main><script src="./reset-password.js"></script></body></html>
