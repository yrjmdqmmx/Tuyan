<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f4f5fb">
    <title>重置图研密码</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./account.css">
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="/logo.svg" alt="图研">
        <span>图研 Tuyan</span>
      </div>

      <section id="form-state">
        <h1>重置密码</h1>
        <p id="security-note">密码至少 8 位。重置后，已登录设备会自动退出，需要使用新密码重新登录。</p>
        <form id="reset-form">
          <input type="text" name="username" autocomplete="username" class="visually-hidden" tabindex="-1" aria-hidden="true">
          <label for="password">新密码</label>
          <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="security-note" required>
          <label for="confirmation">再次输入</label>
          <input id="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
          <div id="message" class="status hidden" role="status"></div>
          <div class="actions"><button type="submit">重置密码</button></div>
        </form>
      </section>

      <section id="invalid-state" class="hidden">
        <h1>链接已失效</h1>
        <p>重置链接缺失、过期或已经使用，请返回图研重新申请。</p>
        <div class="actions"><a href="/">返回图研</a></div>
      </section>

      <section id="success-state" class="hidden">
        <h1>密码重置成功</h1>
        <p>密码已更新，已登录设备已自动退出。现在可以使用新密码重新登录。</p>
        <div class="actions"><a href="/">返回图研登录</a></div>
      </section>
    </main>
    <script src="./reset-password.js"></script>
  </body>
</html>
