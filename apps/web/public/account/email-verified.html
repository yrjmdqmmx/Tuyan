<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图研邮箱验证</title><link rel="stylesheet" href="./account.css"></head><body><main class="card"><div class="brand"><img src="/logo.svg" alt="图研"><span>图研 Tuyan</span></div><section id="success"><h1>邮箱验证成功</h1><p>你的邮箱已验证，现在可以返回图研登录。</p><div class="status success">账号安全状态已更新。</div></section><section id="expired" class="hidden"><h1>链接已失效</h1><p>验证链接已过期，请返回登录页重新发送验证邮件。</p></section><section id="used" class="hidden"><h1>链接已使用</h1><p>该链接已经使用或邮箱已验证，你可以直接登录。</p></section><section id="invalid" class="hidden"><h1>无法验证</h1><p>链接缺失或无效，请重新发送验证邮件。</p></section><div class="actions"><a href="/">返回图研</a></div></main><script>const e=new URLSearchParams(location.search).get('error');const state=!e?'success':/expired/i.test(e)?'expired':/used|already/i.test(e)?'used':'invalid';for(const id of ['success','expired','used','invalid'])document.getElementById(id).classList.toggle('hidden',id!==state);</script></body></html>
